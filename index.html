<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Territory Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game">
  <img id="homeArt" src="https://raw.githubusercontent.com/w0980077002-create/teritory-game/main/home-master.png" alt="">
  <div class="hud">
    <div class="player">
      <b id="name">Эйнар</b>
      <span>VIP <b id="vip">5</b> · LV <b id="level">1</b></span>
    </div>
    <div class="resources">
      <span>🪙 <b id="coins">45 000</b></span>
      <span>💎 <b id="gems">4 500</b></span>
    </div>
    <div class="bars">
      <div class="bar xp"><i style="width:68%"></i></div>
      <div class="bar energy"><i style="width:100%"></i></div>
      <div class="bar hp"><i style="width:100%"></i></div>
    </div>
  </div>

  <button class="hz arena" aria-label="Арена" data-screen="arena"></button>
  <button class="hz shop" aria-label="Лавка" data-screen="shop"></button>
  <button class="hz inventory" aria-label="Инвентарь" data-screen="inventory"></button>

  <div class="screen" id="panel">
    <button id="close">×</button>
    <h2 id="panelTitle"></h2>
    <p id="panelText"></p>
  </div>

  <nav class="bottom">
    <button data-screen="home">🏠<small>Город</small></button>
    <button data-screen="inventory">🎒<small>Инвентарь</small></button>
    <button data-screen="hero">🧝<small>Герой</small></button>
    <button data-screen="arena">⚔️<small>Бой</small></button>
    <button data-screen="shop">🛒<small>Лавка</small></button>
  </nav>
</div>
<script src="app.js"></script>
</body>
</html>
