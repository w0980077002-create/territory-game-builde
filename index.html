<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Territory Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game">
  <img id="homeArt" src="https://raw.githubusercontent.com/w0980077002-create/teritory-game/main/home-master.png">
  <div id="zones"></div>
  <nav class="bottom">
    <button data-screen="home">🏠<small>Город</small></button>
    <button data-screen="inventory">🎒<small>Инвентарь</small></button>
    <button data-screen="hero">🧝<small>Герой</small></button>
    <button data-screen="arena">⚔️<small>Бой</small></button>
    <button data-screen="shop">🛒<small>Лавка</small></button>
    <button id="editorBtn">⚙️<small>Редактор</small></button>
  </nav>
  <section id="gamePanel" class="panel">
    <button class="x" id="closePanel">×</button><h2 id="panelTitle"></h2><div id="panelBody"></div>
  </section>
</div>

<div id="editor" class="editor hidden">
  <header><b>TERRITORY GAME — РЕДАКТОР</b><button id="closeEditor">✕ Играть</button></header>
  <div class="tabs">
    <button data-tab="zones" class="active">🏠 Зоны</button>
    <button data-tab="economy">💰 Экономика</button>
    <button data-tab="items">🎒 Предметы</button>
    <button data-tab="shop">🛒 Лавка</button>
    <button data-tab="followers">👥 Герои</button>
    <button data-tab="assets">🖼️ Арт</button>
  </div>
  <main id="editorContent"></main>
</div>
<script src="app.js"></script>
</body>
</html>
