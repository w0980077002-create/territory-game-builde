<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07111b">
<title>Territory — merged build</title>
<link rel="stylesheet" href="styles.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="profile-mini" id="profileMini" aria-label="Профиль">
      <span id="miniAvatar">⚔️</span>
      <span id="miniName">Игрок</span>
    </button>
    <div class="wallets">
      <span>🪙 <b id="gold">0</b></span>
      <span>💎 <b id="gems">0</b></span>
      <span>⚡ <b id="energy">0/0</b></span>
    </div>
  </header>

  <main id="screen" class="screen"></main>

  <nav class="bottom-nav" id="bottomNav">
    <button data-screen="home" class="active"><span>🏰</span><small>Город</small></button>
    <button data-screen="fight"><span>⚔️</span><small>Бой</small></button>
    <button data-screen="arena"><span>🏆</span><small>Арена</small></button>
    <button data-screen="shop"><span>🛒</span><small>Лавка</small></button>
    <button data-screen="profile"><span>👤</span><small>Герой</small></button>
  </nav>
</div>
<div id="modalRoot"></div>
<script src="app.js"></script>
</body>
</html>
