<script>
/* All coordinates belong to the rig. Weapons are children of wrist groups.
   Fixed-length two-bone IK keeps elbows and knees connected at every frame. */
const $=id=>document.getElementById(id), rad=Math.PI/180;
const idle={x:0,y:0,lean:0,rx:-125,ry:-42,ra:89,lx:137,ly:-69,la:18,rf:-91,lf:88,rl:0,ll:0,head:0,cape:0};
// A continuous timeline: anticipation, quick contact, follow-through, transfer.
const keys=[
 [0,idle],

 [2.08,{x:-17,y:20,lean:-15,rx:-113,ry:-164,ra:40,lx:90,ly:-143,la:-37,rf:-111,lf:96,ll:12,head:9,cape:13}],
 [2.29,{x:43,y:4,lean:16,rx:57,ry:-100,ra:91,lx:159,ly:-103,la:91,rf:-83,lf:156,head:-13,cape:-24}],
 [2.44,{x:47,y:6,lean:17,rx:62,ry:-94,ra:94,lx:162,ly:-98,la:94,rf:-81,lf:160,head:-13,cape:-25}],
 [2.69,{x:44,y:15,lean:12,rx:1,ry:-49,ra:111,lx:134,ly:-61,la:51,rf:-85,lf:139,ll:11,head:-7,cape:-9}],

 [3.22,idle]
].map(([t,p])=>({t,p:{...idle,...p}}));
const duration=keys.at(-1).t;
const armR=$('arm-r'),armL=$('arm-l'),legR=$('leg-r'),legL=$('leg-l');
const parts=g=>Object.fromEntries([...g.children].map(e=>[e.dataset.part,e]));
const arms=[parts(armR),parts(armL)],legs=[parts(legR),parts(legL)];
// The far wrist crosses in front of the chest; retain body-local coordinates.
$('body').insertBefore(arms[1].grip,armR);
const transform=(e,v)=>e.setAttribute('transform',v);
function solve(ax,ay,bx,by,a,b,bend){
 let dx=bx-ax,dy=by-ay,d=Math.hypot(dx,dy);d=Math.min(a+b-.01,Math.max(Math.abs(a-b)+.01,d));
 const base=Math.atan2(dy,dx),off=Math.acos(Math.max(-1,Math.min(1,(a*a+d*d-b*b)/(2*a*d))));
 const angle=base+off*bend,ex=ax+Math.cos(angle)*a,ey=ay+Math.sin(angle)*a;
 // If a target is outside the reach envelope, use the solved wrist position.
 const endAngle=Math.atan2(by-ey,bx-ex),wx=ex+Math.cos(endAngle)*b,wy=ey+Math.sin(endAngle)*b;
 return{ex,ey,wx,wy,upper:angle/rad-90,lower:endAngle/rad-90};
}
function arm(part,sx,sy,wx,wy,angle,bend){
 const j=solve(sx,sy,wx,wy,69,67,bend);
 transform(part.upper,`translate(${sx} ${sy}) rotate(${j.upper})`);
 transform(part.fore,`translate(${j.ex} ${j.ey}) rotate(${j.lower})`);
 transform(part.grip,`translate(${j.wx} ${j.wy}) rotate(${angle})`);
}
function leg(part,hx,hy,fx,lift,bend){
 const fy=151-lift,j=solve(hx,hy,fx,fy,89,88,bend);
 transform(part.thigh,`translate(${hx} ${hy}) rotate(${j.upper})`);
 transform(part.shin,`translate(${j.ex} ${j.ey}) rotate(${j.lower})`);
 transform(part.boot,`translate(${j.wx} ${j.wy}) rotate(${-lift*.4})`);
}
function sample(t){
 let i=0;while(i<keys.length-2&&t>keys[i+1].t)i++;
 const a=keys[i],b=keys[i+1],u=Math.max(0,Math.min(1,(t-a.t)/(b.t-a.t))),s=u*u*(3-2*u);
 return Object.fromEntries(Object.keys(idle).map(k=>[k,a.p[k]+(b.p[k]-a.p[k])*s]));
}
function render(p,t){
 transform($('facing'),`translate(340 367) scale(${direction} 1)`);
 transform($('body'),`translate(${p.x} ${p.y}) rotate(${p.lean})`);
 transform($('head'),`rotate(${p.head} 10 -163)`);
 transform($('cape'),`rotate(${p.cape} -24 -150)`);
 transform($('braid-r'),`rotate(${Math.sin(t*4)*2-p.lean*.55} 18 -115)`);
 transform($('braid-l'),`rotate(${Math.sin(t*4-1)*2-p.lean*.6} 67 -109)`);
 arm(arms[0],-64,-131,p.rx,p.ry,p.ra,-1);
 arm(arms[1],65,-130,p.lx,p.ly,p.la,1);
 // Pelvis follows the torso; feet remain planted independently of body rotation.
 const c=Math.cos(p.lean*rad),s=Math.sin(p.lean*rad);
 leg(legs[0],p.x-35*c,p.y-35*s,p.rf,p.rl,-1);
 leg(legs[1],p.x+37*c,p.y+37*s,p.lf,p.ll,-1);
}
let direction=1,start=null,last=0,clock=0,phase=-2,raf=0;
const phases=[...document.querySelectorAll('.phase')],play=$('play');
function setPhase(next){if(phase===next)return;phase=next;phases.forEach((e,i)=>e.classList.toggle('active',i===next));$('state').textContent=next<0?'Боевая стойка':['Удар 1 · правый','Удар 2 · левый','Удар 3 · крест','Удар 4 · выпад'][next];}
function tick(now){
 const dt=last?Math.min((now-last)/1000,.05):0;last=now;clock+=dt;
 let p;
 if(start!==null){start+=dt;const t=start;p=sample(t);setPhase(t<.65?0:t<1.2?1:t<1.86?2:t<2.76?3:-1);
  if(t>=duration){start=null;play.disabled=false;play.textContent='↗ Запустить комбинацию';setPhase(-1);}
 }else{const b=Math.sin(clock*2.2);p={...idle,y:-b*2,lean:b*.7,rx:idle.rx+b*1.6,ry:idle.ry-b*2,lx:idle.lx-b,ly:idle.ly-b*2,head:-b*.65,cape:b*1.2};setPhase(-1);}
 render(p,clock);raf=requestAnimationFrame(tick);
}
play.addEventListener('click',()=>{if(start!==null)return;start=0;play.disabled=true;play.textContent='Комбинация…';});
for(const [id,dir] of [['left',-1],['right',1]])$(id).addEventListener('click',()=>{direction=dir;$('left').setAttribute('aria-pressed',String(dir===-1));$('right').setAttribute('aria-pressed',String(dir===1));render(start===null?idle:sample(start),clock);});
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);last=0;}else{last=0;raf=requestAnimationFrame(tick);}});
raf=requestAnimationFrame(tick);
</script>
</html>
