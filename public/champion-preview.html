<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#161926" />
    <title>TERRITORY — 2D чемпион арены</title>
    <link rel="stylesheet" href="./assets/territory/champion-preview/preview.css" />
  </head>
  <body>
    <main class="preview-shell">
      <header class="preview-topbar">
        <div class="brand"><span class="brand-sword">⚔</span> TERRITORY <span class="brand-label">АРЕНА</span></div>
        <span class="prototype-badge">2D ПРОТОТИП</span>
      </header>

      <section class="arena" aria-label="Анимированная боевая сцена">
        <div class="arena-shade"></div>
        <div class="nameplates">
          <div class="nameplate champion"><span>🏆 ЧЕМПИОН АРЕНЫ</span><div class="bar"><span id="champion-hp"></span></div></div>
          <div class="nameplate opponent"><span>РАЗБОЙНИК</span><div class="bar"><span id="enemy-hp"></span></div></div>
        </div>
        <svg id="combat-stage" class="combat-stage" viewBox="0 0 500 550" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Золотой чемпион с топором и щитом двигается и сражается с противником">
          <defs>
            <radialGradient id="ground-shadow"><stop offset="0%" stop-color="#120a07" stop-opacity=".65" /><stop offset="100%" stop-color="#120a07" stop-opacity="0" /></radialGradient>
            <radialGradient id="hit-glow"><stop offset="0%" stop-color="#fffbc2" stop-opacity="1"/><stop offset="35%" stop-color="#ffd450" stop-opacity=".85"/><stop offset="100%" stop-color="#ff9238" stop-opacity="0"/></radialGradient>
          </defs>
          <ellipse cx="132" cy="475" rx="77" ry="14" fill="url(#ground-shadow)" />
          <ellipse cx="383" cy="473" rx="93" ry="16" fill="url(#ground-shadow)" />
          <g id="enemy-motion">
            <image class="enemy-sprite" x="219" y="166" width="314" height="314" href="./assets/territory/characters/enemies/bandit/idle.webp" />
          </g>
          <g id="fighter-anchor" transform="translate(132 315) scale(.72)">
            <g id="fighter-motion"></g>
          </g>
          <g id="hit-effects" opacity="0" pointer-events="none">
            <circle id="hit-light" cx="350" cy="321" r="47" fill="url(#hit-glow)" />
            <path id="slash-trail" d="M255 368 Q344 182 436 298" fill="none" stroke="#fff6a0" stroke-width="8" stroke-linecap="round" />
            <path d="M310 286 L289 254 M389 339 L423 356 M382 274 L404 240" stroke="#ffd356" stroke-width="7" stroke-linecap="round" />
          </g>
        </svg>
        <div class="scene-bottom">
          <span id="animation-state" aria-live="polite">Ожидание боя · живое дыхание</span>
          <span class="fps-mark">2D • РУКИ / НОГИ / КОРПУС</span>
        </div>
      </section>

      <section class="arena-controls" aria-label="Управление бойцом">
        <div class="demo-row">
          <button id="demo-toggle" class="demo-button" type="button">▶ СМОТРЕТЬ ЖИВОЙ БОЙ</button>
          <button id="reset-fight" class="reset-button" type="button" aria-label="Сбросить здоровье и анимацию">↻</button>
        </div>
        <p class="controls-hint">Нажми любое действие — увидишь, как по отдельности двигаются суставы, оружие и одежда.</p>
        <div id="move-buttons" class="move-buttons"></div>
      </section>
      <footer class="preview-footer">Отдельный тест чемпиона. Текущая игра, инвентарь и награды сезона не изменены.</footer>
    </main>
    <script type="module" src="./assets/territory/champion-preview/champion-motion.mjs?v=champion-2d-4"></script>
  </body>
</html>
