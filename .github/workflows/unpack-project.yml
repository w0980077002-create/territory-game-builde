name: Install uploaded project ZIP

on:
  push:
    branches: [main]
    paths:
      - '*.zip'
      - '*.zip.part*'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: unpack-uploaded-zip
  cancel-in-progress: false

jobs:
  unpack:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate and unpack project ZIP
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          ZIP_FILES=( *.zip )
          PART_FILES=( *.zip.part* )
          ZIP_FILE=""

          if [ "${#ZIP_FILES[@]}" -eq 1 ] && [ "${#PART_FILES[@]}" -eq 0 ]; then
            ZIP_FILE="${ZIP_FILES[0]}"
          elif [ "${#ZIP_FILES[@]}" -eq 0 ] && [ "${#PART_FILES[@]}" -ge 2 ]; then
            for part in "${PART_FILES[@]}"; do
              if [[ ! "$part" =~ \.part[0-9]{2,}$ ]]; then
                echo "::error::Неверное имя части: $part. Формат: project.zip.part01, project.zip.part02 и т.д."
                exit 1
              fi
            done
            mapfile -t PART_FILES < <(printf '%s\n' "${PART_FILES[@]}" | sort -V)
            mapfile -t BASE_NAMES < <(printf '%s\n' "${PART_FILES[@]}" | sed -E 's/\.part[0-9]+$//' | sort -u)
            if [ "${#BASE_NAMES[@]}" -ne 1 ]; then
              echo "::error::Найдены части нескольких разных архивов. Оставь один набор частей."
              exit 1
            fi
            expected=1
            for part in "${PART_FILES[@]}"; do
              suffix="${part##*.part}"
              number=$((10#$suffix))
              if [ "$number" -ne "$expected" ]; then
                printf '::error::Пропущена часть архива: ожидалась part%02d, получена %s\n' "$expected" "$part"
                exit 1
              fi
              expected=$((expected + 1))
            done
            ZIP_FILE="${BASE_NAMES[0]}"
            echo "Собираем ZIP из ${#PART_FILES[@]} частей: $ZIP_FILE"
            cat -- "${PART_FILES[@]}" > "$ZIP_FILE"
          else
            echo "::error::В корне нужен один .zip или части одного архива: project.zip.part01, project.zip.part02 и т.д."
            exit 1
          fi

          echo "Проверяем архив: $ZIP_FILE"
          unzip -tq "$ZIP_FILE"
          while IFS= read -r entry; do
            if [[ "$entry" == /* || "$entry" =~ (^|/)\.\.(/|$) || "$entry" =~ ^[A-Za-z]:[\\/] ]]; then
              echo "::error::Архив содержит небезопасный путь: $entry"
              exit 1
            fi
          done < <(unzip -Z1 "$ZIP_FILE")

          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT
          unzip -q "$ZIP_FILE" -d "$TEMP_DIR"
          if [ -f "$TEMP_DIR/HEROES_MANIFEST.json" ]; then
            # Character-only ZIP: verify exact asset paths and overlay without deleting project files.
            python3 - "$TEMP_DIR" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          names = ('male_viking', 'male_rogue', 'female_warrior', 'female_archer')
          poses = ('idle', 'attack', 'block', 'dodge', 'hit', 'death')
          prefix = 'public/assets/territory/characters/heroes'
          expected = {f'{prefix}/{name}/{pose}.webp' for name in names for pose in poses}
          allowed = expected | {'HEROES_MANIFEST.json', 'CODEX_TASK_4_HEROES_RU.txt'}
          actual = {str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}
          if not expected.issubset(actual) or not actual.issubset(allowed):
              sys.exit('Character ZIP has missing/unexpected files')
          data = json.loads((root / 'HEROES_MANIFEST.json').read_text('utf-8'))
          if {p['id'] for p in data['characters']} != set(names):
              sys.exit('Hero manifest does not match expected heroes')
          for path in expected:
              sprite = root / path
              if sprite.is_symlink() or sprite.stat().st_size > 1024 * 1024:
                  sys.exit('Invalid hero asset: '+ path)
              with sprite.open('rb') as fh:
                  header = fh.read(12)
              if header[:4] != b'RIFF' or header[8:12] != b'WEBP':
                  sys.exit('Not a WebP sprite: '+ path)
          print('All 24 hero frames validated')
          PY
            mkdir -p public/assets/territory/characters/heroes
            cp -a "$TEMP_DIR/public/assets/territory/characters/heroes/." public/assets/territory/characters/heroes/
            echo "Installed four heroes without touching the rest of TERRITORY."
          elif [ -f "$TEMP_DIR/NPC_MANIFEST.json" ]; then
            # Overlay only the 20 approved NPCs and the optional Trial guardian.
            python3 - "$TEMP_DIR" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          expected_groups = {
              'enemies': {'goblin','boar','bandit','wolf','troll'},
              'bosses': {'bandit_chief','northern_jarl','dark_priest','undead_king','barrow_guardian','abyss_demon','giant_king','storm_lord','fire_lord','chaos_shadow'},
              'followers': {'loyal_shield','northern_warrior','forest_healer','moon_hunter','rune_mage'},
          }
          poses = ('idle', 'attack', 'block', 'dodge', 'hit', 'death')
          prefix = 'public/assets/territory/characters'
          expected = {f'{prefix}/{category}/{name}/{pose}.webp'
                      for category, names in expected_groups.items()
                      for name in names for pose in poses}
          expected.add(f'{prefix}/trial/guardian_idle.webp')
          actual = {str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}
          if actual != expected | {'NPC_MANIFEST.json'}:
              sys.exit('NPC ZIP has missing or unexpected files')
          manifest = json.loads((root / 'NPC_MANIFEST.json').read_text('utf-8'))
          if manifest.get('pack_id') != 'territory-npc-20':
              sys.exit('Unexpected NPC pack')
          for category, names in expected_groups.items():
              if {c['id'] for c in manifest.get('characters', []) if c.get('category')==category} != names:
                  sys.exit('Unexpected NPC roster: ' + category)
          for name in expected:
              sprite = root / name
              if sprite.is_symlink() or not (1024 <= sprite.stat().st_size <= 1024*1024):
                  sys.exit('Invalid NPC file: ' + name)
              with sprite.open('rb') as f:
                  h = f.read(12)
              if h[:4] != b'RIFF' or h[8:12] != b'WEBP':
                  sys.exit('Not WebP: ' + name)
          print('All 120 NPC frames and guardian portrait verified')
          PY
            mkdir -p public/assets/territory/characters
            cp -a "$TEMP_DIR/public/assets/territory/characters/." public/assets/territory/characters/
            echo "Installed 20 NPCs without modifying source code or saved data."
          elif [ -f "$TEMP_DIR/CITY_MANIFEST.json" ]; then
            # The live-city package is an image-only overlay: keep code and saves untouched.
            python3 - "$TEMP_DIR" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          prefix = 'public/assets/territory/scenes/'
          expected = {prefix + 'live-city-bg.webp', prefix + 'live-city-ship.webp', prefix + 'live-city-ship-far.webp'}
          permitted = expected | {'CITY_MANIFEST.json', 'README_RU.txt'}
          found = {str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}
          if found != permitted:
              sys.exit('City ZIP contains missing or unexpected files')
          manifest = json.loads((root / 'CITY_MANIFEST.json').read_text('utf-8'))
          if manifest.get('pack_id') != 'territory-live-city-v1' or set(manifest.get('assets',[])) != expected:
              sys.exit('City asset manifest invalid')
          for name in expected:
              path = root / name
              if path.is_symlink() or not (1024 < path.stat().st_size < 2*1024*1024):
                  sys.exit('Invalid city asset: '+name)
              with path.open('rb') as file:
                  header = file.read(12)
              if header[:4] != b'RIFF' or header[8:12] != b'WEBP':
                  sys.exit('Invalid WebP: '+name)
          print('Verified approved portrait city background and ship overlay')
          PY
            mkdir -p public/assets/territory/scenes
            cp -a "$TEMP_DIR/public/assets/territory/scenes/." public/assets/territory/scenes/
            echo "Installed live city art without changing gameplay files."
          elif [ -f "$TEMP_DIR/ARENA_MANIFEST.json" ]; then
            # Art-only ZIP; validate exact names before applying. Never replace game code.
            python3 - "$TEMP_DIR" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          gear = ('helmet','amulet','armor','weapon','shield','ring','boots')
          items = ('belt','sword','bow','staff','potion-hp','potion-mana','potion-fire',
                   'bomb','scroll','potion-green','food','net','potion-energy')
          prefix = 'public/assets/territory/'
          expected = {prefix+'ui/equipment/'+s+'.webp' for s in gear}
          expected |= {prefix+'ui/items/'+s+'.webp' for s in items}
          expected.add(prefix+'scenes/arena-viking.webp')
          actual = {str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}
          if actual != expected | {'ARENA_MANIFEST.json'}:
              sys.exit('Arena ZIP has missing or unexpected files')
          m = json.loads((root/'ARENA_MANIFEST.json').read_text('utf-8'))
          if m.get('pack_id') != 'territory-arena-final-v1' or set(m.get('assets',[])) != expected:
              sys.exit('Arena manifest mismatch')
          for name in expected:
              file = root/name
              if file.is_symlink() or not (1024 < file.stat().st_size < 2*1024*1024):
                  sys.exit('Invalid arena art: '+name)
              with file.open('rb') as fp:
                  header=fp.read(12)
              if header[:4] != b'RIFF' or header[8:12] != b'WEBP':
                  sys.exit('Not WEBP: '+name)
          print('Validated arena illustration and 20 transparent icons.')
          PY
            mkdir -p public/assets/territory/scenes public/assets/territory/ui
            cp -a "$TEMP_DIR/public/assets/territory/scenes/." public/assets/territory/scenes/
            cp -a "$TEMP_DIR/public/assets/territory/ui/." public/assets/territory/ui/
            echo "Installed the approved arena artwork only."
          else
            if [ -f "$TEMP_DIR/package.json" ] && [ -d "$TEMP_DIR/src" ]; then
              SOURCE_DIR="$TEMP_DIR"
            else
              mapfile -t PROJECT_ROOTS < <(
                find "$TEMP_DIR" -mindepth 2 -maxdepth 5 -type f -name package.json -printf '%h\n' |
                while IFS= read -r candidate; do
                  [ -d "$candidate/src" ] && printf '%s\n' "$candidate"
                done | sort -u
              )
              if [ "${#PROJECT_ROOTS[@]}" -ne 1 ]; then
                echo "::error::Не найден единственный корень проекта с package.json и папкой src."
                exit 1
              fi
              SOURCE_DIR="${PROJECT_ROOTS[0]}"
            fi
            echo "Корень проекта: $SOURCE_DIR"
            # Keep automation and environment files in the repository; replace only project files.
            rsync -a --delete \
              --exclude='/.git/' \
              --exclude='/.github/' \
              --exclude='/.env' \
              --exclude='/.env.*.local' \
              "$SOURCE_DIR/" ./
          fi
          rm -f -- "$ZIP_FILE" "${PART_FILES[@]}"
          test -f package.json
          test -d src
          echo "Проверка структуры пройдена; ZIP распакован."

      - name: Commit project files
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GitHub Action Bot"
          git config user.email "action@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Изменений нет."
            exit 0
          fi
          git commit -m "Auto-unpack uploaded project ZIP"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Start GitHub Pages deployment
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
