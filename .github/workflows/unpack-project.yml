name: Install uploaded project ZIP

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: 'ZIP file in repository root'
        required: true
        default: 'territory-project.zip'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        env:
          ZIP_PATH: ${{ inputs.zip_path }}
        run: |
          set -e
          test -f "$ZIP_PATH"
          tmp=$(mktemp -d)
          unzip -q "$ZIP_PATH" -d "$tmp"
          root="$tmp"
          first=$(find "$tmp" -mindepth 1 -maxdepth 1 -type d | head -n1 || true)
          if [ -n "$first" ] && [ "$(find "$tmp" -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ]; then root="$first"; fi
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name "$ZIP_PATH" -exec rm -rf {} +
          cp -a "$root"/. .
          rm -f "$ZIP_PATH"
      - name: Commit unpacked project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy uploaded project package' || echo 'No changes to commit'
          git push
