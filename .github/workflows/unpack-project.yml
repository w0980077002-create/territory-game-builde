name: Install uploaded project ZIP

on:
  push:
    paths:
      - '**.zip'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          set -e
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "Ошибка: ZIP-файл не найден!"
            exit 1
          fi
          
          echo "Распаковка файла: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d ./
          rm "$ZIP_FILE"

      - name: Commit changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "Auto-unzip from mobile" || exit 0
          git push origin main
