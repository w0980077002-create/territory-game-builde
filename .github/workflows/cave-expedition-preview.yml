name: Cave expedition - isolated playable artifact
on:
  push:
    branches: [codex/cave-expedition-demo]
  pull_request:
    branches: [main]
    paths:
      - 'src/game/cavePreviewWorld/**'
      - 'src/game/cave/**'
      - 'src/components/pve/cave/**'
      - 'public/assets/territory/cave/playtest/**'
      - 'scripts/*cave-playtest*'
      - 'src/components/pve/CaveExpeditionPreview.tsx'
      - 'src/components/pve/cavePreview/**'
      - 'public/assets/territory/cave-expedition/**'
      - 'scripts/*cave-expedition*'
      - 'scripts/*cave-animation*'
      - 'scripts/art/import-cave-animation.py'
      - 'scripts/*crystal-rift*'
      - 'scripts/*cave-portals*'
      - 'scripts/*cave-floor*'
      - 'scripts/*cave-cloud*'
      - 'scripts/fixtures/cave-client-cloud.ts'
      - 'src/game/caveCloudPve.ts'
      - '.github/workflows/cave-expedition-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-preview:
    # Pinned: the pinned Playwright cannot install Chromium dependencies on the ubuntu-26.04 image behind ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run test:cave-expedition
      - run: npm run test:cave-playtest
      - run: npm run lint
      - run: node scripts/check-cave-systems.mjs
      - run: node scripts/check-cave-belt-attestation.mjs
      - run: node scripts/check-dark-stones.mjs
      - run: node scripts/check-adventure-client-ui.mjs
      - run: npm run build
      - run: npm run build:cave-preview
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - name: Browser acceptance at four mobile widths
        run: |
          export CAVE_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          npm run test:cave-expedition:browser
          npm run test:cave-animation:browser
          python scripts/check-cave-playtest-browser.py
          python scripts/check-cave-floor-browser.py
          python scripts/check-cave-expedition-performance.py
          python scripts/check-crystal-rift-browser.py
          python scripts/check-cave-portals-browser.py
          node scripts/build-cave-expedition-preview.mjs --cloud-test
          python scripts/check-cave-cloud-browser.py
          node scripts/build-journey-preview.mjs
          python scripts/check-journey-browser.py
      - name: Record a real-time playable run
        run: |
          export CAVE_BROWSER="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python scripts/record-cave-expedition.py
          python scripts/record-cave-animation.py
      - name: Package only delivery files
        if: always()
        run: |
          cp docs/CAVE_EXPEDITION_DEMO_RU.md artifacts/cave-expedition/READ-ME-RU.md
          rm -f artifacts/cave-expedition/test-fixture.html artifacts/cave-expedition/cloud-fixture.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: territory-cave-demo-${{ github.sha }}
          path: artifacts/cave-expedition/
          retention-days: 30
