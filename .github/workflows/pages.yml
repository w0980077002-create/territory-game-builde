name: Build and deploy Territory to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: territory-github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      economy_ready: ${{ steps.economy_release.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure Supabase
        shell: bash
        run: |
          echo "VITE_SUPABASE_URL=https://wmyrdpbwlkzsktnhookx.supabase.co" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndteXJkcGJ3bGt6c2t0bmhvb2t4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NTk2OTAsImV4cCI6MjEwNjUzNTY5MH0.oxrA-8UngHYOUVNP-fHdwbENBb_KP-9cM87EjdBNsEQ" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      # Beta fast lane: comprehensive regressions run in review-ci.yml on PRs.
      # Keep these small, high-value checks on every Pages release to prevent
      # broken UI builds, auth regressions and lost currency/saves. Restore the
      # wider suite here when beta development slows down.
      - name: Fast beta release checks
        run: |
          npm run typecheck
          node scripts/check-release-invariants.mjs
          node scripts/check-economy-receipts-foundation.mjs
          node scripts/check-inventory-acl-contract.mjs
          node scripts/auth-mock-tests.cjs
          node scripts/edge-identity-tests.cjs
          node scripts/check-admin-claim-client.mjs
          node scripts/check-admin-new-players.mjs
          node scripts/check-admin-top-diamonds.mjs
          node scripts/check-adventure-receipt-adapter.mjs
          node scripts/check-adventure-client-ui.mjs
          npm run test:events
          npm run test:workshop

      - name: Economy release gate
        id: economy_release
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const gate = JSON.parse(fs.readFileSync('economy-release.json', 'utf8'));
          const ready = gate.ready === true;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `ready=${ready}\n`);
          if (!ready) console.log(`Pages publication blocked: ${gate.reason}`);
          JS

      - name: Build
        run: npm run build

      - name: Setup fast image tooling
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Optimize approved game images for Telegram
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
          python scripts/optimize-pages-images.py
          node scripts/check-monopoly-performance.mjs --verify-assets
          node scripts/check-pages-image-optimization.mjs

      - name: Verify approved Telegram RU/EN banners
        run: node scripts/check-approved-telegram-promo.mjs

      - name: Verify public promo previews
        run: |
          test -s dist/promo/og-ru-v3.jpg
          test -s dist/promo/og-en-v3.jpg
          test -s dist/promo/ru/index.html
          test -s dist/promo/en/index.html


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: needs.build.outputs.economy_ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
