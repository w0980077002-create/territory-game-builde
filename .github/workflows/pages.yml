name: Build and deploy Territory to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      economy_ready: ${{ steps.economy_release.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure Supabase
        shell: bash
        run: |
          echo "VITE_SUPABASE_URL=https://wmyrdpbwlkzsktnhookx.supabase.co" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndteXJkcGJ3bGt6c2t0bmhvb2t4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NTk2OTAsImV4cCI6MjEwNjUzNTY5MH0.oxrA-8UngHYOUVNP-fHdwbENBb_KP-9cM87EjdBNsEQ" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and regression checks
        run: |
          npm run typecheck
          npm run test:economy
          npm run test:professions
          npm run test:balance
          npm run test:pve
          npm run test:inventory-cleanup
          npm run test:gear-recycle
          npm run test:gear-showcase
          npm run test:companion-navigation
          npm run test:founders
          npm run test:referral-activity
          node scripts/check-equipment-safety-v4.mjs
          npm run test:feature-separation
          npm run test:mobile-home
          node scripts/check-combat-visuals.mjs
          node scripts/check-arena-postfight.mjs
          node scripts/check-belt-victory-milestones.mjs
          node scripts/check-arena-matchmaking.mjs
          node scripts/auth-mock-tests.cjs
          node scripts/edge-initdata-tests.cjs
          node scripts/edge-identity-tests.cjs

      - name: Economy release gate
        id: economy_release
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const gate = JSON.parse(fs.readFileSync('economy-release.json', 'utf8'));
          const ready = gate.ready === true;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `ready=${ready}\n`);
          if (!ready) console.log(`Pages publication blocked: ${gate.reason}`);
          JS

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: needs.build.outputs.economy_ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
