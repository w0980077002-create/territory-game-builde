name: VIP staged validation (never deploy)
on:
  pull_request:
    paths:
      - 'src/game/belt.ts'
      - 'src/game/vipBeltCave.ts'
      - 'src/game/vipEquipmentPresets.ts'
      - 'src/components/VipEquipmentPresets.tsx'
      - 'src/components/GearShowcase.tsx'
      - 'scripts/check-vip-equipment-client.mjs'
      - 'src/game/vipBeltClassic.ts'
      - 'src/components/pve/PveFight.tsx'
      - 'src/components/BattleScreen.tsx'
      - 'scripts/check-vip-classic-refill.mjs'
      - 'src/game/arenaSecure.ts'
      - 'src/components/pve/ServerAdventureScreen.tsx'
      - 'src/game/types.ts'
      - 'src/game/vipDaily.ts'
      - 'src/game/vipWeekly.ts'
      - 'src/game/vipClaimQueue.ts'
      - 'src/game/vipBootRecovery.ts'
      - 'src/App.tsx'
      - 'src/game/vipProgram.ts'
      - 'src/game/fortuneVip.ts'
      - 'src/game/actions.ts'
      - 'src/components/VipStatusPanel.tsx'
      - 'src/components/InventoryScreen.tsx'
      - 'src/components/BattleScreen.tsx'
      - 'src/components/arena/ArenaRoom.tsx'
      - 'src/components/home/CityLivingHero.tsx'
      - 'supabase/staged/20261104_vip_daily_chest_v1.sql'
      - 'supabase/staged/20261105_vip_weekly_chest_v1.sql'
      - 'supabase/staged/20261105_vip_entitlements_v1.sql'
      - 'supabase/staged/20261105_vip_rune_presets_v1.sql'
      - 'scripts/check-vip-rune-presets-pg17.sql'
      - 'supabase/staged/20261105_vip_equipment_presets_v1.sql'
      - 'scripts/check-vip-presets-pg17.sql'
      - 'supabase/staged/20261105_vip_pve_bonus_v1.sql'
      - 'supabase/staged/territory_v1_adventure_settlement.sql'
      - 'scripts/check-adventure-service-sql.mjs'
      - 'scripts/check-vip-entitlements-pg17.sql'
      - 'scripts/check-vip-*.mjs'
      - '.github/workflows/vip-stage-validation.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vip-staged-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  client-and-staged-db:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: TypeScript and production build
        run: npm run typecheck && npm run build
      - name: Existing belt and save regressions
        run: node scripts/check-belt-victory-milestones.mjs && npm run test:elixir-expiry
      - name: VIP smart belt invariants
        run: npm run test:vip-belt
      - name: Cave and Arena verified receipts, CAS and replay-safe belt refill
        run: node scripts/check-vip-cave-refill-client.mjs
      - name: VIP equipment preset client owner CAS and lost-ack replay
        run: node scripts/check-vip-equipment-client.mjs
      - name: Campaign and Trials victory/defeat WAL-bundled belt refill
        run: node scripts/check-vip-classic-refill.mjs && node scripts/check-pve-victory-save-fence.mjs && node scripts/check-pve-victory-recovery.mjs
      - name: VIP daily staged database and security receipt tests
        run: npm run test:vip-daily
      - name: VIP weekly staged database, expiry and client receipts
        run: npm run test:vip-weekly
      - name: Chest eligibility from the real VIP entitlement ledger
        run: node scripts/check-vip-chest-entitlements-pglite.mjs
      - name: VIP profile uses verified entitlement, expiry and legacy fallback
        run: node scripts/check-vip-entitlement-client.mjs
      - name: VIP gold and XP in real PvE settlement (PGlite)
        run: VIP_PVE_TEST=1 node scripts/check-adventure-service-sql.mjs

  weekly-native-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 17 availability
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          psql -v ON_ERROR_STOP=1 -c 'SELECT version();'
      - name: Weekly chest PostgreSQL 17, JWT and RLS
        run: psql -v ON_ERROR_STOP=1 -f scripts/check-vip-weekly-pg17.sql

  entitlements-native-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          psql -v ON_ERROR_STOP=1 -c 'SELECT version();'
      - name: VIP entitlements and equipment presets PG17 JWT/RLS CAS/replay
        run: psql -v ON_ERROR_STOP=1 -f scripts/check-vip-entitlements-pg17.sql -f scripts/check-vip-presets-pg17.sql

  runes-native-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          psql -v ON_ERROR_STOP=1 -c 'SELECT version();'
      - name: VIP runes protected 15-slot preset and combat gates
        run: psql -v ON_ERROR_STOP=1 -f scripts/check-vip-rune-presets-pg17.sql
