name: Quarter-hour repository health monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: territory-quarter-hour-health
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect latest main and open PR checks (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          from datetime import datetime, timezone
          repo = os.environ["GH_REPO"]
          token = os.environ["GH_TOKEN"]
          def get(path):
              req = urllib.request.Request(
                  "https://api.github.com/repos/" + repo + path,
                  headers={"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "territory-health-monitor"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)
          def line(s):
              print(s)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                  f.write(s + "\n")
          line("## TERRITORY read-only health snapshot")
          line("UTC: " + datetime.now(timezone.utc).isoformat())
          main = get("/branches/main")
          sha = main["commit"]["sha"]
          line("main SHA: `" + sha + "`")
          runs = get("/actions/runs?branch=main&per_page=10")["workflow_runs"]
          for run in runs:
              if run["name"] == "Quarter-hour repository health monitor":
                  continue
              line("- main workflow: " + run["name"] + " — " + run["status"] +
                   " / " + str(run["conclusion"]) + " (" + run["html_url"] + ")")
          prs = get("/pulls?state=open&per_page=30")
          line("Open PRs (first 30): " + str(len(prs)))
          for pr in prs:
              line("- PR #" + str(pr["number"]) + " " + pr["title"] + " — " +
                   ("draft" if pr["draft"] else "open") + " (" + pr["html_url"] + ")")
              checks = get("/commits/" + pr["head"]["sha"] + "/check-runs?per_page=100")
              for check in checks.get("check_runs", []):
                  if check["name"] == "observe":
                      continue
                  if check["conclusion"] in ("failure", "timed_out", "cancelled", "action_required"):
                      line("  - CHECK ATTENTION: " + check["name"] + " / " + str(check["conclusion"]))
          line("")
          line("Monitoring only: no production writes, no deployment, no Codex/ChatGPT invocation.")
          PY
