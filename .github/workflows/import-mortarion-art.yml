name: Import Mortarion layered art (one-time)
on:
  push:
    branches:
      - feat/mortarion-layered-raid-20261109
    paths:
      - .github/workflows/import-mortarion-art.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download separate game sprites (one-time)
        run: |
          set -euo pipefail
          mkdir -p public/assets/territory/events
          curl --fail --location --silent --show-error --retry 3 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F870c05c4-9918-4a3b-a3f9-584400483e43/watermark:F/width:133?csig=AAAAAAAAAAAAAAAAAAAAANwwEf_5h78vuau7-_5d5tmcf2vBqCn0CEquCkfl6UM7&exp=1794263868&osig=AAAAAAAAAAAAAAAAAAAAAIADv8risLKWqsCedp2YHA7EDw_nGA45TKrcHDqzMRhJ&signer=media-rpc&token=AAIAAU0AJDg3MGMwNWM0LTk5MTgtNGEzYi1hM2Y5LTU4NDQwMDQ4M2U0MwAAAAABocJ14mBftPodnEkL0kGeC2cVxayG7PAuEkH9XH1xkbXMV1eKLw&x-canva-quality=thumbnail' -o "public/assets/territory/events/mortarion-boss-layer.png"
          curl --fail --location --silent --show-error --retry 3 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F0facda93-3f43-45f1-9968-7847c861bb8a/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAKYw27HDfs34_LwcgWZoLWJ1VRCQKy6CAEzSECTFjIWy&exp=1794265672&osig=AAAAAAAAAAAAAAAAAAAAALFoE9-WCX1ASTzc-GY-tjYg_NV5O1RjZH8N04SCPhRg&signer=media-rpc&token=AAIAAU0AJDBmYWNkYTkzLTNmNDMtNDVmMS05OTY4LTc4NDdjODYxYmI4YQAAAAABocKRaUANxWNOxATEOwyum2BCgQRNAd6tVihUtnH37zYb09ZrDw&x-canva-quality=thumbnail' -o "public/assets/territory/events/mortarion-fx-souls.png"
          curl --fail --location --silent --show-error --retry 3 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F3c5c2db6-d38d-494a-bdf4-4146199c1b0f/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAFBx3enevFa0bvx7xqAbI17XXY0lwpkfrMkRz5vWkiTd&exp=1794266936&osig=AAAAAAAAAAAAAAAAAAAAABEc4PHAgmRyQ-vjsShvhQ5trZSlDsTCxbE-HjCvwKnh&signer=media-rpc&token=AAIAAU0AJDNjNWMyZGI2LWQzOGQtNDk0YS1iZGY0LTQxNDYxOTljMWIwZgAAAAABocKkssB7IDgyIYmQFEp1-xQIdCx0FOTapo8UkxC_tbYRVUlvGg&x-canva-quality=thumbnail' -o "public/assets/territory/events/mortarion-fx-core.png"
          curl --fail --location --silent --show-error --retry 3 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F9e12b717-d5de-4592-b276-b14986d41e82/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAO4k_I7_FSbuTNyX5wWNyp8vRO_1OTOaCNJlwpollzCP&exp=1794267529&osig=AAAAAAAAAAAAAAAAAAAAAFx2e_TzuxFk-GqV9BO91pZM1jkq6fmQr5TEWjSCAU0b&signer=media-rpc&token=AAIAAU0AJDllMTJiNzE3LWQ1ZGUtNDU5Mi1iMjc2LWIxNDk4NmQ0MWU4MgAAAAABocKtvygsAYQULo0JoBX3Fg-LkVwn_uWBKctWGK1CNdv8Oikh7Q&x-canva-quality=thumbnail' -o "public/assets/territory/events/mortarion-fx-vortex.png"
          curl --fail --location --silent --show-error --retry 3 'https://media.canva.com/v2/image-resize/format:PNG/height:66/quality:100/uri:ifs%3A%2F%2FM%2Ff4118e80-217b-4378-817b-123e45779a42/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAKcFadpoYLLFccfVAy6P3TPLL15Uf_CCxSyuH057WyO2&exp=1794265843&osig=AAAAAAAAAAAAAAAAAAAAAORvNV09sRwgvSpIcHDUQ1hK7tMfoBKN3l0ZJYJBAQYc&signer=media-rpc&token=AAIAAU0AJGY0MTE4ZTgwLTIxN2ItNDM3OC04MTdiLTEyM2U0NTc3OWE0MgAAAAABocKUBTgFQfkb4KwBnXK9Nq9lsUoUtg9f5P7qj6N4DqyPlVBknQ&x-canva-quality=thumbnail' -o "public/assets/territory/events/mortarion-fx-floor.png"
          curl --fail --location --silent --show-error --retry 3 'https://media.canva.com/v2/image-resize/format:PNG/height:112/quality:100/uri:ifs%3A%2F%2FM%2F41ba8858-38ed-42e5-8387-7a8835bc37ac/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAHDCOapk4Lbo5d3us9DIu_vqA7jRfS9ySgaqx48C7K5y&exp=1794266658&osig=AAAAAAAAAAAAAAAAAAAAAKWEkIpjd8Q8HRBw93K1CH4dvDsInJErMlxc9UDSG3Jp&signer=media-rpc&token=AAIAAU0AJDQxYmE4ODU4LTM4ZWQtNDJlNS04Mzg3LTdhODgzNWJjMzdhYwAAAAABocKgdNBRtOu44H95cgFmZpHd6Mh9NA8TBLNpDWi8oWEZSsEC2A&x-canva-quality=thumbnail' -o "public/assets/territory/events/mortarion-background.png"
          for p in public/assets/territory/events/mortarion-{boss-layer,background,fx-souls,fx-core,fx-vortex,fx-floor}.png; do
            test "$(head -c 4 "$p" | od -An -tu1 | tr -s ' ')" = ' 137 80 78 71' || { echo "Not PNG: $p"; exit 1; }
            test "$(stat -c %s "$p")" -gt 1000 || { echo "Image too small: $p"; exit 1; }
          done
      - name: Commit layered sprites to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/territory/events/mortarion-*.png
          if ! git diff --cached --quiet; then
            git commit -m 'assets(mortarion): add six independent PNG layers for raid screen'
            git push
          fi
