name: TERRITORY community bot checks
on:
  push:
    branches:
      - feat/territory-community-ai-bot-485
  pull_request:
    paths:
      - 'supabase/functions/territory-community/**'
      - 'scripts/check-territory-community*.mjs'
      - '.github/workflows/territory-community-humor-ci.yml'
  workflow_dispatch:
jobs:
  community-bot-safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Pure policy tests
        run: |
          node scripts/check-territory-community.mjs
          node scripts/check-territory-community-humor.mjs
      - name: Deno check webhook and admin API
        run: |
          deno check supabase/functions/territory-community/index.ts
          deno check supabase/functions/admin-api/index.ts
      - name: Install UI dependencies
        run: npm ci
      - name: Check admin UI
        run: |
          npm run typecheck
          npm run lint
          npm run build
