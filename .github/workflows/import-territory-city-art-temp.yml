name: Import approved TERRITORY-CITY badge (one-time)
on:
  push:
    branches:
      - feat/city-reputation-royal-badge-20261107
permissions:
  contents: write
jobs:
  place-approved-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copy approved royal badge into the game repository
        env:
          BADGE_IMAGE_URL: "https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F3139ec6f-6ccf-47e5-a4d3-918774f73707/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAEAHInZWCVc8Pvtcw74o8RToJtAOaGH1osKFbmnIUbMh&exp=1794091179&osig=AAAAAAAAAAAAAAAAAAAAAE1lK2TCeUQa4rQ5A-sjYyEAef-KwdWjk1cAxW34N1T7&signer=media-rpc&token=AAIAAU0AJDMxMzllYzZmLTZjY2YtNDdlNS1hNGQzLTkxODc3NGY3MzcwNwAAAAABobgq2_ixinIZd2Rv-FYgdlB6ZBisdIIfoz8CjgKMdYH-WyaLNQ&x-canva-quality=thumbnail"
        run: |
          set -euo pipefail
          mkdir -p public/assets/territory/ui/trial-loot
          curl --fail --location --retry 3 --max-time 90 "$BADGE_IMAGE_URL" -o public/assets/territory/ui/trial-loot/city-reputation.png
          file public/assets/territory/ui/trial-loot/city-reputation.png | grep -q 'PNG image data'
          test "$(wc -c < public/assets/territory/ui/trial-loot/city-reputation.png)" -gt 5000
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/territory/ui/trial-loot/city-reputation.png
          if ! git diff --cached --quiet; then
            git commit -m "Import user-approved TERRITORY-CITY royal crest artwork"
            git push origin HEAD:refs/heads/feat/city-reputation-royal-badge-20261107
          fi
