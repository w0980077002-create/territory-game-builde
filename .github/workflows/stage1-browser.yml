name: Territory stage1 mobile interfaces
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/stage1/**'
      - 'scripts/*slots*'
      - 'scripts/*-browser.py'
      - 'scripts/build-*-preview.mjs'
      - 'package*.json'
      - '.github/workflows/stage1-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [stage1, slots, adventure, hero, gameplay-ui, workshop-ui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install chromium --with-deps
      - run: node scripts/stage1/build-preview.mjs
        if: matrix.suite == 'stage1'
      - run: python scripts/stage1/check-browser.py
        if: matrix.suite == 'stage1'
      - run: node scripts/build-slots-preview.mjs
        if: matrix.suite == 'slots'
      - run: python scripts/check-slots-browser.py
        if: matrix.suite == 'slots'
      - run: node scripts/build-profile-preview.mjs
        if: matrix.suite == 'hero'
      - run: python scripts/check-profile-browser.py
        if: matrix.suite == 'hero'
      - run: node scripts/build-adventure-preview.mjs
        if: matrix.suite == 'adventure'
      - run: python scripts/check-adventure-browser.py
        if: matrix.suite == 'adventure'
      - run: python scripts/check-cave-compact-layout.py
        if: matrix.suite == 'adventure'
      - run: node scripts/build-journey-preview.mjs && python scripts/check-journey-browser.py
        if: matrix.suite == 'gameplay-ui'
      - run: node scripts/build-arena-room-preview.mjs && python scripts/check-arena-room-browser.py
        if: matrix.suite == 'gameplay-ui'
      - run: node scripts/build-arena-result-preview.mjs && python scripts/check-arena-result-browser.py
        if: matrix.suite == 'gameplay-ui'
      - run: node scripts/build-runes-preview.mjs && python scripts/check-runes-browser.py
        if: matrix.suite == 'workshop-ui'
      - run: node scripts/build-workshop-preview.mjs && python scripts/check-workshop-browser.py
        if: matrix.suite == 'workshop-ui'
      - run: node scripts/build-journal-preview.mjs && python scripts/check-journal-browser.py
        if: matrix.suite == 'workshop-ui'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: territory-mobile-review-${{ matrix.suite }}
          path: |
            /tmp/territory-stage1-ui
            /tmp/slots-screenshots
            /tmp/adventure-screenshots
            /tmp/territory-hero-360.png
            /tmp/territory-profile-360.png
            /tmp/territory-item-360.png
            /tmp/territory-city-360.png
