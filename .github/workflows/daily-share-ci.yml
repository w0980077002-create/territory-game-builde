name: Territory daily sharing verification
on:
  pull_request:
    paths:
      - 'src/game/dailyShare.ts'
      - 'src/game/DailyShareCard.tsx'
      - 'src/components/monopoly/**'
      - 'src/components/BattleScreen.tsx'
      - 'public/promo/**'
      - 'scripts/generate-promo-banners.py'
      - 'supabase/staged/territory_daily_share_v1.sql'
      - '.github/workflows/**'
      - 'scripts/check-daily-share.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: node scripts/check-daily-share.mjs
      - run: npm run build
      - name: Verify approved Telegram RU/EN banners
        run: node scripts/check-approved-telegram-promo.mjs

      - run: |
          test -s dist/promo/ru/index.html
          test -s dist/promo/en/index.html
          test -s dist/promo/og-ru-v2.jpg
          test -s dist/promo/og-en-v2.jpg
