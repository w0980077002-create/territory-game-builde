name: Territory daily sharing verification
on:
  pull_request:
    paths:
      - 'src/game/dailyShare.ts'
      - 'src/game/DailyShareCard.tsx'
      - 'src/components/monopoly/**'
      - 'src/components/BattleScreen.tsx'
      - 'public/promo/**'
      - 'scripts/generate-promo-banners.py'
      - 'supabase/staged/territory_daily_share_v1.sql'
      - '.github/workflows/**'
      - 'scripts/check-daily-share.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: node scripts/check-daily-share.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==11.3.0
      - run: python scripts/generate-promo-banners.py
      - run: npm run build
      - run: |
          test -s dist/promo/ru/index.html
          test -s dist/promo/en/index.html
          test -s dist/promo/og-ru.jpg
          test -s dist/promo/og-en.jpg
