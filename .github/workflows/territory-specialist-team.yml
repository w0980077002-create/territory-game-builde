name: TERRITORY specialist team (offline, no release)

# An owner-approved [AGENT:ROLE] issue activates a scoped specialist check.
# Hourly Lead triage is read-only. No model subscriptions or DB access.
on:
  issues:
    types: [opened, edited]
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: territory-specialist-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  specialist:
    if: >-
      github.event_name == 'issues' &&
      github.actor == 'w0980077002-create' &&
      github.event.issue.user.login == 'w0980077002-create' &&
      startsWith(github.event.issue.title, '[AGENT:') &&
      contains(github.event.issue.body, 'SPECIALIST_APPROVED: owner-2026-11-08') &&
      (github.event.action == 'opened' || github.event.changes.body != null)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out current main with no write credentials
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Validate owner task and select specialist
        id: plan
        run: python3 scripts/agents/specialist_dispatch.py plan >> "$GITHUB_OUTPUT"
      - name: Install Node
        if: steps.plan.outputs.role != 'LEAD'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install project tools
        if: steps.plan.outputs.role != 'LEAD'
        run: npm ci --ignore-scripts
      - name: Run role-specific checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/agents/specialist_dispatch.py check
      - name: Post real results into the task
        if: always() && steps.plan.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NO: ${{ steps.plan.outputs.issue }}
        shell: bash
        run: |
          if [ ! -f /tmp/territory-specialist-report.md ]; then
            printf 'Specialist run stopped before report. See Actions logs. No live changes.\n' > /tmp/territory-specialist-report.md
          fi
          gh issue comment "$ISSUE_NO" --body-file /tmp/territory-specialist-report.md

  hourly-lead:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Report hourly backlog and PRs without changing them
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/agents/specialist_dispatch.py hourly
