name: Adventure PostgreSQL integration

on:
  pull_request:
  push:
    branches:
      - copilot/runes-adventures-integration
      - copilot/issue-125-adventure
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: territory_adventure_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d territory_adventure_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Typecheck and build cave + Arena integration
        run: |
          npm run typecheck
          node scripts/check-adventure-receipt-adapter.mjs
          node scripts/check-arena-entry-recovery.mjs
          npm run build
      - name: Check adventure client cutover and receipt wiring
        run: |
          node scripts/check-adventure-client-ui.mjs
          node scripts/check-adventure-receipt-adapter.mjs
          npm run typecheck
          npm run build
      - name: Ensure PostgreSQL client is available
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Test PostgreSQL transactions with independent connections
        run: node scripts/check-adventure-postgres.mjs
        env:
          ADVENTURE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/territory_adventure_ci
      - name: Rehearse guarded live-function patch and phase-A stop on clone
        run: |
          PGPASSWORD=postgres createdb -h 127.0.0.1 -U postgres territory_adventure_clone_ci
          node scripts/check-adventure-postgres.mjs
        env:
          ADVENTURE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/territory_adventure_clone_ci
      - name: Rehearse settlement with checked-in V1 guards
        run: |
          PGPASSWORD=postgres createdb -h 127.0.0.1 -U postgres territory_adventure_guards_ci
          node scripts/check-adventure-postgres-v1-guards.mjs
        env:
          ADVENTURE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/territory_adventure_guards_ci

      - name: Verify independent rune ledger on disposable PostgreSQL 17
        run: |
          PGPASSWORD=postgres createdb -h 127.0.0.1 -U postgres territory_runes_ci
          PGPASSWORD=postgres psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d territory_runes_ci -f scripts/fixtures/rune-ledger-v1-pg17.sql
      - name: Test immutable rune battle snapshots on the same disposable PostgreSQL 17 database
        run: PGPASSWORD=postgres psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d territory_runes_ci -f scripts/fixtures/rune-battle-snapshot-v1-pg17.sql
