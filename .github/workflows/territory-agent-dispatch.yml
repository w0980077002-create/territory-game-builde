name: TERRITORY free autonomous agents

# No subscription, external API key, paid model provider, or production access.
# An explicit issue created by the owner with the [AI:ROLE] prefix triggers the agent.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: territory-free-agent-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  act:
    if: >-
      github.actor == 'w0980077002-create' &&
      github.event.issue.user.login == 'w0980077002-create' &&
      startsWith(github.event.issue.title, '[AI:')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out production code for isolated changes
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Verify owner-issued request and strict target scope
        id: task
        run: python3 scripts/agents/free_issue_agent.py plan >> "$GITHUB_OUTPUT"

      - name: Verify quality gate before agent starts
        run: python3 -m unittest discover -s scripts/agents -p 'test_agent_acceptance.py'

      - name: Prepare project tools
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Start free local open-source code model
        if: steps.task.outputs.role != 'QA'
        run: |
          docker run -d --name territory-agent-model --pull always -p 127.0.0.1:11434:11434 ollama/ollama:latest
          ready=0
          for attempt in $(seq 1 45); do
            if docker exec territory-agent-model ollama list >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs territory-agent-model
            echo "::error::Ollama server did not become ready"
            exit 1
          fi
          docker exec territory-agent-model ollama pull qwen2.5-coder:3b

      - name: Generate one small isolated code edit
        if: steps.task.outputs.role != 'QA'
        run: |
          python3 scripts/agents/free_issue_agent.py edit
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "${{ steps.task.outputs.target }}"

      - name: Verify TypeScript
        run: npm run typecheck

      - name: Verify lint
        run: npm run lint

      - name: Verify current PvE mechanics for gameplay and QA agents
        if: steps.task.outputs.role == 'GAMEPLAY' || steps.task.outputs.role == 'QA'
        run: npm run test:pve

      - name: Verify production build
        run: npm run build

      - name: Open draft PR when permitted, otherwise leave a recoverable branch
        if: steps.task.outputs.role != 'QA'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NO: ${{ steps.task.outputs.issue }}
          ROLE: ${{ steps.task.outputs.role }}
          TARGET: ${{ steps.task.outputs.target }}
        run: |
          branch="agent/free-issue-$ISSUE_NO"
          git switch -c "$branch"
          git add -- "$TARGET"
          git -c user.name="territory-free-agent[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "agent($ROLE): draft change for issue #$ISSUE_NO"
          git push -u origin "$branch"
          if gh pr create --draft --base main --head "$branch" \
            --title "AI $ROLE: safe draft for #$ISSUE_NO" \
            --body "Generated by local Qwen2.5-Coder 3B in GitHub Actions. Typecheck, lint and build passed. Not deployed or visually accepted. Do not merge until owner approves."; then
            echo "Draft PR created by bot."
          else
            echo "::warning::Bot cannot open PR under repository settings. Code was safely pushed to $branch."
            gh issue comment "$ISSUE_NO" --body "🧪 Бесплатный агент сохранил НЕПРИНЯТЫЙ черновик с прошедшими техническими проверками (не означает художественную приёмку), ветка: [agent/free-issue-$ISSUE_NO](https://github.com/$GITHUB_REPOSITORY/tree/agent/free-issue-$ISSUE_NO). GitHub запретил боту открывать PR; проверяющий должен открыть его вручную. **Не опубликовано, мобильная визуальная приёмка не пройдена.**"
          fi

      - name: Confirm free QA report
        if: steps.task.outputs.role == 'QA'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NO: ${{ steps.task.outputs.issue }}
        run: |
          gh issue comment "$ISSUE_NO" --body "✅ Free QA agent: npm ci, typecheck, lint, test:pve and build passed on current main. No live-game changes."

      - name: Report failure without applying any live changes
        if: failure() && steps.task.outputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NO: ${{ steps.task.outputs.issue }}
        run: gh issue comment "$ISSUE_NO" --body "⚠️ Free agent could not safely finish this task. No automatic merge or production change was made. See the GitHub Actions run for the failing step."
