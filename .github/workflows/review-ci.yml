name: Territory - safe review checks (never deploy)

on:
  push:
    branches:
      - review/telegram-auth-20261013
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript, build and regressions
    if: github.ref == 'refs/heads/review/telegram-auth-20261013' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/auth-mock-tests.cjs
      - run: node scripts/edge-initdata-tests.cjs
      - run: node scripts/edge-identity-tests.cjs
      - run: npm run typecheck
      - run: npm run test:stage1
      - run: npm run test:slots
      - run: npm run build
      - run: node scripts/check-pages-build-sha.mjs
      - run: npm run test:balance
      - run: npm run test:pve
      - run: node scripts/check-pve-recovery-controls.mjs
      - run: npm run test:inventory-cleanup
      - run: npm run test:gear-recycle
      - run: npm run test:gear-showcase
      - run: npm run test:workshop
      - run: npm run test:companion-navigation
      - run: npm run test:founders
      - run: npm run test:referral-activity
      - run: npm run test:hall
      - run: npm run test:admin-master
      - run: npm run test:admin-mail
      - run: npm run test:admin-geography
      - run: npm run test:economy
      - run: node scripts/check-equipment-safety-v4.mjs
      - run: npm run test:professions
      - run: npm run test:professions:stage8
      - run: npm run test:master-license
      - run: npm run test:feature-separation
      - run: npm run test:mobile-home
      - run: npm run test:visual-viking
      - run: npm run test:events
      - run: node scripts/check-combat-visuals.mjs
      - run: node scripts/check-arena-postfight.mjs
      - run: node scripts/check-belt-victory-milestones.mjs
      - run: node scripts/check-arena-matchmaking.mjs
      - run: node scripts/check-rune-skill-book.mjs
      - run: node scripts/check-v1-full-combat-catalog.mjs
