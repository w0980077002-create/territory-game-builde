name: Wheel of Fortune verification
on:
  pull_request:
    paths:
      # Wheel/Hall coverage stays available for actual changes and manual dispatch.
      - 'src/components/FortuneDialog.tsx'
      - 'src/components/WheelOfFortune.tsx'
      - 'src/components/fortune.css'
      - 'src/components/TreasuryInventory.tsx'
      - 'src/components/HallPlayScreen.tsx'
      - 'src/components/monopoly/**'
      - 'src/game/*fortune*'
      - 'src/game/*wheel*'
      - 'src/game/*hall*'
      - 'supabase/migrations/*wheel*'
      - 'supabase/staged/*fortune*'
      - 'scripts/*fortune*'
      - 'scripts/*monopoly*'
      - 'package*.json'
      - '.github/workflows/fortune-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run test:wheel
      - run: npm run test:hall
      - run: npm run test:economy
      - run: npm run test:saves
      - run: npm run test:progression
      - run: npm run test:professions
      - run: npm run build
