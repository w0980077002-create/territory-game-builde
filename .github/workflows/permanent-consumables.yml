name: TERRITORY permanent consumables — regression

on:
  pull_request:
    branches: [main]
    paths:
      # Keep this regression for actual economy, belt and inventory changes.
      - 'src/game/actions.ts'
      - 'src/game/store.ts'
      - 'src/game/types.ts'
      - 'src/game/cloud.ts'
      - 'src/game/saveQueue.ts'
      - 'src/game/immediateSave.ts'
      - 'src/game/walletVersion.ts'
      - 'src/game/economyInvariant.ts'
      - 'src/game/elixirExpiry.ts'
      - 'src/game/belt.ts'
      - 'src/game/forge*.ts'
      - 'src/game/gear*.ts'
      - 'src/game/equipment*.ts'
      - 'src/game/pve*.ts'
      - 'src/game/arena*.ts'
      - 'src/game/useArenaRoom.ts'
      - 'src/game/useStrikeQueue.ts'
      - 'src/components/ForgeScreen.tsx'
      - 'src/components/GearShowcase.tsx'
      - 'src/components/arena/BeltBar.tsx'
      - 'src/components/ui/BeltCells.tsx'
      - 'src/components/Inventory*.tsx'
      - 'src/components/Belt*.tsx'
      - 'supabase/migrations/**'
      - 'supabase/staged/**'
      - 'scripts/*elixir*'
      - 'scripts/*belt*'
      - 'scripts/*inventory*'
      - 'scripts/*warehouse*'
      - 'package*.json'
      - '.github/workflows/permanent-consumables.yml'
  push:
    branches: [main]
    paths:
      # Keep this regression for actual economy, belt and inventory changes.
      - 'src/game/actions.ts'
      - 'src/game/store.ts'
      - 'src/game/types.ts'
      - 'src/game/cloud.ts'
      - 'src/game/saveQueue.ts'
      - 'src/game/immediateSave.ts'
      - 'src/game/walletVersion.ts'
      - 'src/game/economyInvariant.ts'
      - 'src/game/elixirExpiry.ts'
      - 'src/game/belt.ts'
      - 'src/game/forge*.ts'
      - 'src/game/gear*.ts'
      - 'src/game/equipment*.ts'
      - 'src/game/pve*.ts'
      - 'src/game/arena*.ts'
      - 'src/game/useArenaRoom.ts'
      - 'src/game/useStrikeQueue.ts'
      - 'src/components/ForgeScreen.tsx'
      - 'src/components/GearShowcase.tsx'
      - 'src/components/arena/BeltBar.tsx'
      - 'src/components/ui/BeltCells.tsx'
      - 'src/components/Inventory*.tsx'
      - 'src/components/Belt*.tsx'
      - 'supabase/migrations/**'
      - 'supabase/staged/**'
      - 'scripts/*elixir*'
      - 'scripts/*belt*'
      - 'scripts/*inventory*'
      - 'scripts/*warehouse*'
      - 'package*.json'
      - '.github/workflows/permanent-consumables.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-expiry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: node scripts/check-belt-victory-milestones.mjs
      - run: npm run test:elixir-expiry
      - run: node scripts/check-vip-belt-refill.mjs
      - run: node scripts/check-inventory-preparation.mjs
      - run: node scripts/check-compact-warehouse.mjs
      - run: node scripts/check-arena-live-belt-guard.mjs
      - run: npm run build
