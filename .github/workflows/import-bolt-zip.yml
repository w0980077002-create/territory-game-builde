name: Import Bolt ZIP

on:
  push:
    branches: [main]
    paths:
      - "bolt-project.zip.part*"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail

          cat bolt-project.zip.part* > bolt-project.zip

          rm -rf /tmp/bolt
          mkdir -p /tmp/bolt
          unzip -q bolt-project.zip -d /tmp/bolt

          root="/tmp/bolt/project"
          if [ ! -d "$root" ]; then
            root="$(find /tmp/bolt -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          fi

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "bolt-project.zip.part*" \
            -exec rm -rf {} +

          cp -a "$root"/. .

          rm -f .env
          cat > .env.example <<'EOF'
VITE_SUPABASE_URL=YOUR_SUPABASE_URL
VITE_SUPABASE_ANON_KEY=YOUR_SUPABASE_ANON_KEY
EOF

          rm -f bolt-project.zip bolt-project.zip.part*

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import current Bolt project" || echo "No changes to commit"
          git push
