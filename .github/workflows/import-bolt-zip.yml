name: Import Bolt ZIP

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Import Bolt project
        shell: bash
        run: |
          set -euo pipefail

          echo "Rebuilding ZIP..."
          cat bolt-project.zip.part01 bolt-project.zip.part02 > bolt-project.zip

          echo "Checking ZIP..."
          unzip -tq bolt-project.zip

          echo "Extracting..."
          rm -rf /tmp/bolt
          mkdir -p /tmp/bolt
          unzip -q bolt-project.zip -d /tmp/bolt

          root="/tmp/bolt/project"

          if [ ! -d "$root" ]; then
            root="$(find /tmp/bolt -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          fi

          echo "Project root: $root"

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "bolt-project.zip.part01" \
            ! -name "bolt-project.zip.part02" \
            -exec rm -rf {} +

          cp -a "$root"/. .

          rm -f .env

          cat > .env.example <<'EOF'
VITE_SUPABASE_URL=YOUR_SUPABASE_URL
VITE_SUPABASE_ANON_KEY=YOUR_SUPABASE_ANON_KEY
EOF

          rm -f bolt-project.zip
          rm -f bolt-project.zip.part01
          rm -f bolt-project.zip.part02

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Import current Bolt project" || true
          git push
