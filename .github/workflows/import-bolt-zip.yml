name: Import Bolt ZIP

on:
  push:
    branches:
      - main
    paths:
      - "bolt-project.zip.part01"
      - "bolt-project.zip.part02"
      - ".github/workflows/import-bolt-zip.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild and import current Bolt project
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Rebuilding ZIP ==="
          test -f bolt-project.zip.part01
          test -f bolt-project.zip.part02
          cat bolt-project.zip.part01 bolt-project.zip.part02 > bolt-project.zip

          echo "=== Checking ZIP ==="
          unzip -tq bolt-project.zip

          echo "=== Extracting ZIP ==="
          rm -rf /tmp/bolt
          mkdir -p /tmp/bolt
          unzip -q bolt-project.zip -d /tmp/bolt

          echo "=== Finding project root ==="
          root="/tmp/bolt/project"

          if [ ! -d "$root" ]; then
            root="$(find /tmp/bolt -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          fi

          test -d "$root"

          echo "Project root: $root"

          echo "=== Replacing repository files ==="
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "bolt-project.zip.part01" \
            ! -name "bolt-project.zip.part02" \
            -exec rm -rf {} +

          cp -a "$root"/. .

          echo "=== Removing environment file ==="
          rm -f .env

          printf '%s\n' \
            'VITE_SUPABASE_URL=YOUR_SUPABASE_URL' \
            'VITE_SUPABASE_ANON_KEY=YOUR_SUPABASE_ANON_KEY' \
            > .env.example

          echo "=== Removing temporary ZIP files ==="
          rm -f bolt-project.zip
          rm -f bolt-project.zip.part01
          rm -f bolt-project.zip.part02

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Import current Bolt project" || echo "Nothing to commit"
          git push
