name: TERRITORY mobile deep-navigation visual tests (no deployment)
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/build-responsive-visual-preview.mjs'
      - 'scripts/capture-responsive-interactions.py'
      - 'scripts/fixtures/responsive-visual-preview.tsx'
      - '.github/workflows/responsive-interactions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive-interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: node scripts/build-responsive-visual-preview.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/capture-responsive-interactions.py public/qa-responsive-visual.html /tmp/territory-responsive-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: territory-deep-navigation-mobile-screenshots
          path: /tmp/territory-responsive-qa/
          retention-days: 7
