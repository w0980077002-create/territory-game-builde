name: Monopoly - isolated review and test artifact (no deployment)
on:
  pull_request:
    paths:
      - 'src/components/monopoly/**'
      - 'src/components/HallPlayScreen.tsx'
      - 'supabase/staged/territory_monopoly_v2*.sql'
      - 'scripts/*monopoly*'
      - '.github/workflows/monopoly-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npx eslint src/components/monopoly/*.tsx src/components/monopoly/api.ts
      - run: node scripts/check-monopoly-v2.mjs
      - run: node scripts/check-monopoly-test-build.mjs
      - run: node scripts/check-monopoly-visuals.mjs
      - run: npm run test:hall
      - run: npm run test:admin-master
      - run: npm run test:feature-separation
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://offline-monopoly-test.supabase.co
          VITE_SUPABASE_ANON_KEY: offline-build-only
  visual-review:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'review/monopoly-safe-test-20261017'
    permissions:
      contents: write
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/monopoly-safe-test-20261017
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: node scripts/build-monopoly-visual-preview.mjs /tmp/monopoly-visual-review.html
      - run: python scripts/capture-monopoly-visuals.py /tmp/monopoly-visual-review.html /tmp/monopoly-screenshots
      - name: Save screenshots only to the existing Monopoly review branch
        run: |
          mkdir -p docs/monopoly/screenshots
          cp /tmp/monopoly-screenshots/*.png /tmp/monopoly-screenshots/verification.json docs/monopoly/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/monopoly/screenshots
          if ! git diff --cached --quiet; then
            git commit -m "Record Chromium mobile screenshots for Monopoly review"
            git push origin HEAD:refs/heads/review/monopoly-safe-test-20261017
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monopoly-mobile-screenshots
          path: /tmp/monopoly-screenshots/
          retention-days: 7
  test-artifact:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/review/monopoly-safe-test-20261017'
    needs: verify
    environment: monopoly-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/build-monopoly-test.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.MONOPOLY_TEST_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.MONOPOLY_TEST_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: monopoly-android-test-${{ github.sha }}
          path: dist-monopoly-test/
          retention-days: 7

  compact-mobile-preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.head.ref == 'review/monopoly-compact-mobile-20261018' || github.event.pull_request.head.ref == 'fix/monopoly-mini-dice-compact-panels-20261019' || github.event.pull_request.head.ref == 'review/monopoly-referral-share-antispam-20261019' || github.event.pull_request.head.ref == 'review/territory-daily-share-ru-en-20261019' || github.event.pull_request.head.ref == 'fix/daily-share-direct-telegram-bot-20261019')
    permissions:
      contents: read
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: node scripts/build-monopoly-visual-preview.mjs /tmp/monopoly-visual-review.html
      - run: python scripts/capture-monopoly-visuals.py /tmp/monopoly-visual-review.html /tmp/monopoly-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monopoly-compact-mobile-preview
          path: /tmp/monopoly-screenshots/
          retention-days: 7
