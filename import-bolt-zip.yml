name: Import current Bolt ZIP

on:
  push:
    branches: [main]
    paths:
      - "bolt-project.zip.part*"
      - "import-bolt-zip.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild Bolt ZIP
        shell: bash
        run: |
          set -euo pipefail
          ls -lh bolt-project.zip.part*
          cat bolt-project.zip.part* > bolt-project.zip
          unzip -tq bolt-project.zip

      - name: Unpack Bolt ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/bolt-project
          mkdir -p /tmp/bolt-project
          unzip -q bolt-project.zip -d /tmp/bolt-project

          root="/tmp/bolt-project"
          first_dir="$(find /tmp/bolt-project -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)"
          if [ -n "$first_dir" ] && [ "$(find /tmp/bolt-project -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ]; then
            root="$first_dir"
          fi

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name '*.zip.part*' \
            ! -name 'bolt-project.zip' \
            -exec rm -rf {} +

          cp -a "$root"/. .

          # Never publish Bolt's local environment/secrets.
          rm -f .env

          cat > .env.example <<'EOF'
VITE_SUPABASE_URL=YOUR_SUPABASE_URL
VITE_SUPABASE_ANON_KEY=YOUR_SUPABASE_ANON_KEY
EOF

          rm -f bolt-project.zip
          rm -f bolt-project.zip.part*

      - name: Commit imported project
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import current Bolt project" || echo "No changes to commit"
          git push
